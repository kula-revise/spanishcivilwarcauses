<style>

  --red:#ef7a6d; --gold:#e2b64e; --morado:#c29adb; --morado-soft:#2c2136;
  --ok:#7fc58b; --ok-soft:#1c2e20; --bad:#ef7a6d; --bad-soft:#35201d;
  --tag-k:#1f3047; --tag-a:#3a3016; --tag-e:#33254a; --tag-n:#2c2831; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#15111a; --surface:#1e1925; --sunk:#110d15; --ink:#ece7f1; --muted:#a79fb2; --line:#3a3245;
  --red:#ef7a6d; --gold:#e2b64e; --morado:#c29adb; --morado-soft:#2c2136;
  --ok:#7fc58b; --ok-soft:#1c2e20; --bad:#ef7a6d; --bad-soft:#35201d;
  --tag-k:#1f3047; --tag-a:#3a3016; --tag-e:#33254a; --tag-n:#2c2831; color-scheme:dark}

.skill .v{font-family:var(--mono);font-size:13px;text-align:right;font-variant-numeric:tabular-nums}
pre.sum{white-space:pre-wrap;font-family:var(--mono);font-size:13px;background:var(--sunk);padding:14px;border-radius:3px;max-width:760px;max-height:360px;overflow:auto}
.nextrow{display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--line);margin-top:34px;padding-top:16px}
.dots{display:flex;align-items:center;gap:6px;flex-basis:100%}

.st-head{margin-bottom:14px}
.opts{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}

<header class="top">
  <div class="flag" aria-hidden="true"><i></i><i></i><i></i></div>
  <div class="bar">
    <div class="brand"><span class="eyebrow">IB History Paper 2 · Causes and effects of 20th-century wars</span><h1>Why did Spain go to war in 1936?</h1></div>

      <div><div class="t" id="clockT">00:00</div><div class="plan" id="clockPlan">Planned 90 min</div></div>

<script>
(function(){
"use strict";
var KEY="scw-causes-lesson-v1";
var S={};
try{var raw=localStorage.getItem(KEY); if(raw) S=JSON.parse(raw)||{};}catch(e){S={};}
S.scores=S.scores||{}; S.text=S.text||{}; S.data=S.data||{};
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function $(sel,root){return (root||document).querySelector(sel);}
function el(tag,attrs,html){var e=document.createElement(tag); if(attrs){for(var k in attrs){if(k==="class")e.className=attrs[k]; else if(k==="text")e.textContent=attrs[k]; else e.setAttribute(k,attrs[k]);}} if(html!=null)e.innerHTML=html; return e;}
function shuffle(a,seed){var r=a.slice(),s=seed||7;for(var i=r.length-1;i>0;i--){s=(s*9301+49297)%233280;var j=Math.floor(s/233280*(i+1));var t=r[i];r[i]=r[j];r[j]=t;}return r;}
function setScore(key,got,total,skill){S.scores[key]={got:got,total:total,skill:skill};save();}

/* ---------- reusable pieces ---------- */
function think(parent,key,prompt,hint){
  var box=el("div",{class:"think"});
  box.appendChild(el("span",{class:"eyebrow",text:"Think it through"}));
  box.appendChild(el("p",null,prompt));
  var ta=el("textarea",{id:"t-"+key,"aria-label":"Your answer"});
  ta.placeholder=hint||"Jot your thinking here. We will talk it through.";
  ta.value=S.text[key]||"";
  ta.addEventListener("input",function(){S.text[key]=ta.value;save();});
  box.appendChild(ta); parent.appendChild(box); return ta;
}
function brk(m){m.appendChild(el("div",{class:"brk"}));}
function qrem(m){m.appendChild(el("p",{class:"howto",text:"Question: Examine the long- and short-term causes of one 20th-century war."}));}
function fb(parent){var f=el("div",{class:"fb","aria-live":"polite"});parent.appendChild(f);return f;}

function mcqSet(parent,key,qs,skill){
  var st=S.data[key]||{};
  qs.forEach(function(q,qi){
    var box=el("div",{class:"mcq"});
    box.appendChild(el("p",{class:"q"},(qi+1)+". "+q.q));
    var opts=el("div",{class:"opts"}); var ex=el("p",{class:"ex"}); ex.hidden=true;
    q.o.forEach(function(o,oi){
      var b=el("button",{class:"chip",type:"button",text:o});
      b.addEventListener("click",function(){ if(st[qi]!=null)return; st[qi]=oi; S.data[key]=st; paint(); score();});
      opts.appendChild(b);
    });
    function paint(){ var bs=opts.querySelectorAll("button"); if(st[qi]==null)return;
      bs.forEach(function(b,bi){ if(bi===q.a)b.classList.add("right"); else if(bi===st[qi])b.classList.add("wrong");});
      ex.hidden=false; ex.textContent=q.ex; }
    box.appendChild(opts); box.appendChild(ex); parent.appendChild(box); paint();
  });
  function score(){var g=0,n=0;qs.forEach(function(q,i){if(st[i]!=null){n++; if(st[i]===q.a)g++;}}); if(n===qs.length)setScore(key,g,qs.length,skill); save();}
}

function sorter(parent,key,items,bins,skill,note){
  var place=(S.data[key]&&S.data[key].place)||{}; var selected=null; var checked=false;
  var pool=el("div",{class:"pool","aria-label":"Cards to sort"});
  var binWrap=el("div",{class:"bins"}); var binEls={};
  bins.forEach(function(b){ var be=el("button",{class:"bin",type:"button"}); be.appendChild(el("span",{class:"bh",text:b.label})); be.addEventListener("click",function(ev){ if(ev.target!==be && ev.target.classList.contains("chip"))return; if(selected==null)return; place[selected]=b.id; selected=null; commit();}); binEls[b.id]=be; binWrap.appendChild(be);});
  var chips=items.map(function(it,i){ var c=el("button",{class:"chip",type:"button",text:it.t}); c.addEventListener("click",function(ev){ev.stopPropagation(); selected=(selected===i?null:i); checked=false; draw();}); return c;});
  var order=shuffle(items.map(function(_,i){return i;}),items.length*3);
  function commit(){S.data[key]={place:place};save();checked=false;draw();}
  function draw(){
    order.forEach(function(i){ var c=chips[i]; c.classList.toggle("sel",selected===i); c.classList.remove("right","wrong");
      if(checked&&place[i]!=null){c.classList.add(place[i]===items[i].b?"right":"wrong");}
      var dest=place[i]!=null?binEls[place[i]]:pool; if(c.parentNode!==dest)dest.appendChild(c);});
    Object.keys(binEls).forEach(function(k){binEls[k].classList.toggle("armed",selected!=null);});
  }
  parent.appendChild(el("p",{class:"howto",text:note||"Tap a card, then tap the box it belongs in. Tap a placed card to move it again."}));
  parent.appendChild(pool); parent.appendChild(binWrap);

 {id:"A",s:["The Spanish Civil War started in 1936 and there were many causes.","Spain had lots of problems with land and with the Church.","In 1931 the king left and the Second Republic started.","Azaña made lots of reforms which some people did not like.","Then in 1933 the right won the election and in 1934 there was a rising in Asturias.","In 1936 the Popular Front won, Calvo Sotelo was murdered and the army rebelled.","This shows that there were lots of causes of the war."],
  band:2,comment:"This is a story of 1931 to 1936, told in order. The facts are broadly right but thin (which reforms, who disliked them, and why?). No cause is explained and nothing is linked to long-term versus short-term. The last sentence restates the question rather than answering it.",fix:"Pick one cause, name it in the first sentence, give two specific pieces of evidence and say how they led to war."},
 {id:"B",s:["The land question was a major long-term cause of the war.","In the south, estates were owned by a small elite and worked by braceros who were unemployed for much of the year.","In 1932 the Republic passed the Agrarian Reform Law, which promised to redistribute land, but by the end of 1933 only a few thousand families had been settled.","This angered the peasants, and membership of the socialist land workers' union, the FNTT, grew rapidly.","When the centre-right government reversed the reforms after 1933, tensions rose further.","Therefore the land question was an important cause of the war."],
  band:3,comment:"Focused, accurate and relevant, and the paragraph opens with a clear claim. It explains a chain from grievance to reform to anger. It stops short of analysis: it never shows how anger became war in 1936, and it does not weigh land against other causes or bring in any perspective. The conclusion repeats the opening.",fix:"Add the 1936 land seizures and landowners' response, then end with a judgement about how important land was compared with another cause."},
 {id:"C",s:["The land question shows most clearly how a long-term grievance became a short-term cause of war.","The concentration of estates in Andalusia and Extremadura had kept braceros poor for generations, but it only became explosive once the Republic raised and then dashed their hopes.","The 1932 Agrarian Reform Law settled only a few thousand families by the end of 1933, and the centre-right then reversed reforms and let wages fall.","When the Popular Front returned in February 1936, labourers did not wait: in March, tens of thousands occupied estates in Badajoz.","To landowners this looked like revolution, and many backed the generals as the only force that could restore order.","Preston sees this defence of privilege as the heart of the rising, while Payne would reply that the Republic's failure to keep order, more than the grievance itself, made war likely.","Both views suggest the land question was necessary but not sufficient: it supplied the anger, while the politics of 1933 to 1936 turned that anger into war."],

/* ---------- shell ---------- */
var rail=$("#rail"), main=$("#main"); var cur=S.cur||0;
function railDraw(){rail.innerHTML=""; var cum=0; STATIONS.forEach(function(s,i){cum+=s.mins; var b=el("button",{class:"railbtn",type:"button","aria-current":String(i===cur)}); if((S.visited||{})[i]&&i!==cur)b.classList.add("done");
  b.innerHTML='<span class="n">'+String(i+1).padStart(2,"0")+'</span><span class="lbl">'+s.title+'</span><span class="m">'+s.mins+'′</span>'; b.addEventListener("click",function(){go(i);}); rail.appendChild(b);});
  rail.appendChild(el("div",{class:"railtotal",text:"Total "+cum+" minutes"}));}
function go(i,si){cur=i; S.cur=i; S.visited=S.visited||{}; S.visited[i]=true; railDraw();
  var s=STATIONS[i]; var holder=el("div"); s.render(holder);
  var slides=[el("section",{class:"slide"})];
  Array.prototype.slice.call(holder.childNodes).forEach(function(n){ if(n.classList&&n.classList.contains("brk")){slides.push(el("section",{class:"slide"}));} else slides[slides.length-1].appendChild(n);});
  if(si==null)si=0; if(si<0)si=slides.length-1; si=Math.min(si,slides.length-1); S.slide=si; save();
  main.innerHTML=""; var hd=el("div",{class:"st-head"}); hd.appendChild(el("h2",{text:s.title}));
  var start=0; for(var k=0;k<i;k++)start+=STATIONS[k].mins;
  hd.appendChild(el("span",{class:"meta",text:"Station "+(i+1)+" of "+STATIONS.length+" · "+s.mins+" min · minute "+start+" to "+(start+s.mins)}));
  var dots=el("div",{class:"dots","aria-label":"Slides in this station"});
  slides.forEach(function(_,d){var b=el("button",{type:"button","aria-label":"Slide "+(d+1),"aria-current":String(d===si)}); b.addEventListener("click",function(){go(i,d);}); dots.appendChild(b);});
  dots.appendChild(el("span",{class:"meta",text:"Slide "+(si+1)+" of "+slides.length}));
  hd.appendChild(dots); main.appendChild(hd);
  main.appendChild(slides[si]);
  var nx=el("div",{class:"nextrow"});
  var pv=el("button",{class:"btn ghost",type:"button",text:"Previous"}); pv.disabled=(i===0&&si===0);
  pv.addEventListener("click",function(){ if(si>0)go(i,si-1); else go(i-1,-1);});
  var last=si===slides.length-1; var nt;
  if(!last){nt=el("button",{class:"btn",type:"button",text:"Next"}); nt.addEventListener("click",function(){go(i,si+1);});}
  else {nt=el("button",{class:"btn",type:"button",text:i===STATIONS.length-1?"Back to start":"Next station: "+STATIONS[i+1].title}); nt.addEventListener("click",function(){go(i===STATIONS.length-1?0:i+1,0);});}
  nx.appendChild(pv); nx.appendChild(nt); main.appendChild(nx); updPlan();
  window.scrollTo(0,0);}
/* lesson clock */
var clockT=$("#clockT"),clockBtn=$("#clockBtn"),clockPlan=$("#clockPlan"); var running=false; var elapsed=S.elapsed||0; var tick=null;
function fmt(s){return String(Math.floor(s/60)).padStart(2,"0")+":"+String(s%60).padStart(2,"0");}
function updPlan(){var start=0; for(var k=0;k<cur;k++)start+=STATIONS[k].mins; var end=start+STATIONS[cur].mins; var mins=elapsed/60;
  clockPlan.textContent=mins>end?"Behind plan · this station ends at "+end+"′":"On plan · this station ends at "+end+"′";}
clockT.textContent=fmt(elapsed); if(elapsed)clockBtn.textContent="Resume";
clockBtn.addEventListener("click",function(){ if(running){clearInterval(tick);running=false;clockBtn.textContent="Resume";return;}
  running=true; clockBtn.textContent="Pause"; tick=setInterval(function(){elapsed++; S.elapsed=elapsed; if(elapsed%10===0)save(); clockT.textContent=fmt(elapsed); if(elapsed%30===0)updPlan();},1000);});
go(cur,S.slide||0);
})();
</script>
